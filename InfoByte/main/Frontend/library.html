<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кітапхана · InfoByte</title>
  <style>
    :root {
      --navy: #0b2a55;
      --navy-deep: #0f2f5f;
      --navy-mid: #17508c;
      --blue: #1f56c9;
      --blue-text: #1f6fd1;
      --page: #f3f7fc;
      --line: #e0e8f3;
      --muted: #5f6c80;
      --sans: "Inter", "Segoe UI", "Helvetica Neue", Roboto, Arial, system-ui, sans-serif;
      --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { -webkit-text-size-adjust: 100%; color-scheme: light; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--navy);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
    }

    .wrap { width: min(1175px, calc(100% - 32px)); margin-inline: auto; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #7fb0ff;
      outline-offset: 2px;
    }

    /* Шапка */
    .site { background: #fff; border-bottom: 1px solid var(--line); }
    .site-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; min-height: 90px;
    }
    .logo {
      font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
      color: var(--navy); text-decoration: none;
    }
    .logo span { color: var(--blue-text); }
    .home { color: var(--navy); font-size: 18px; font-weight: 500; text-decoration: none; }
    .home:hover { color: var(--blue-text); }

    /* Іздеу блогы */
    .hero {
      position: relative; overflow: hidden;
      margin-top: 45px;
      padding: clamp(24px, 6vw, 68px);
      border-radius: clamp(24px, 4vw, 36px);
      background: linear-gradient(100deg, var(--navy-deep) 0%, #15407a 55%, var(--navy-mid) 100%);
      color: #fff;
    }
    .hero::before, .hero::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    }
    .hero::before {
      width: 560px; height: 560px; top: -330px; right: -170px;
      border: 80px solid rgba(255, 255, 255, 0.045);
    }
    .hero::after {
      width: 330px; height: 330px; top: -250px; right: 20px;
      background: rgba(255, 255, 255, 0.035);
    }
    .hero > * { position: relative; z-index: 1; }

    .hero-label { margin: 0 0 14px; font-size: 16px; color: rgba(255, 255, 255, 0.88); }
    .hero h1 {
      margin: 0 0 28px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.1; font-weight: 800; letter-spacing: -1.2px;
    }

    .search {
      display: flex; gap: 8px; padding: 6px;
      border-radius: 22px; background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }
    .search input {
      flex: 1; min-width: 0; border: 0; background: transparent;
      padding: 0 20px; font: inherit; font-size: 20px; color: var(--navy);
    }
    .search input::placeholder { color: #6b7a90; }
    .search input:focus-visible { outline: none; }
    .search:focus-within { box-shadow: 0 0 0 4px #7fb0ff; }
    .go {
      flex: none; height: 60px; padding: 0 26px;
      border: 0; border-radius: 16px; background: var(--blue); color: #fff;
      font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: background-color 0.15s;
    }
    .go:hover { background: #1948b0; }

    .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 22px; }
    .examples-label { margin-right: 4px; font-size: 20px; font-weight: 600; }
    .chip {
      padding: 12px 19px; border: 1.5px solid rgba(255, 255, 255, 0.55); border-radius: 999px;
      background: rgba(255, 255, 255, 0.04); color: #fff;
      font: inherit; font-size: 16px; cursor: pointer;
      transition: background-color 0.15s;
    }
    .chip:hover { background: rgba(255, 255, 255, 0.16); }

    /* Нәтиже картасы */
    .card {
      margin: 32px 0 56px;
      padding: clamp(22px, 5vw, 52px);
      min-height: 290px;
      border: 1px solid var(--line); border-radius: clamp(24px, 4vw, 36px);
      background: #fff;
    }
    .eyebrow { margin: 0; color: var(--muted); font-size: 17px; }
    .card h2 {
      margin: 22px 0 16px;
      font-size: clamp(24px, 4vw, 32px); line-height: 1.25; font-weight: 800;
      overflow-wrap: anywhere;
    }
    .card.is-problem h2 { color: #a12b2b; }

    .notice {
      margin: 0 0 18px; padding: 12px 16px;
      border: 1px solid #efd98f; border-radius: 14px;
      background: #fff7de; color: #5c4400; font-size: 16px;
    }
    .meta { margin: 0 0 16px; color: var(--muted); font-size: 17px; }
    .meta strong { color: var(--navy); }

    #excerpt {
      max-width: 72ch; margin: 0;
      font-family: var(--serif);
      font-size: clamp(19px, 2.6vw, 26px); line-height: 1.6;
      overflow-wrap: anywhere;
    }
    #excerpt mark {
      padding: 0 0.15em; border-radius: 4px;
      background: #ffe27a; color: var(--navy);
    }

    .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 28px; }
    .nav {
      padding: 12px 20px; border: 1.5px solid #c9d7ec; border-radius: 14px;
      background: #fff; color: var(--navy);
      font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
      transition: background-color 0.15s;
    }
    .nav:hover:not(:disabled) { background: #eef4fd; }
    .nav:disabled { opacity: 0.4; cursor: not-allowed; }
    .position { min-width: 4.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

    @media (max-width: 520px) {
      .site-inner { min-height: 70px; }
      .logo { font-size: 26px; }
      .home { font-size: 16px; }
      .hero { margin-top: 24px; }
      .search { flex-direction: column; }
      .search input { flex: none; height: 56px; font-size: 18px; }
      .go { width: 100%; height: 54px; }
      .examples-label { width: 100%; font-size: 18px; }
      .card { margin: 20px 0 40px; min-height: 0; }
      .pager { flex-wrap: nowrap; justify-content: space-between; gap: 8px; }
      .nav { padding: 12px 14px; font-size: 16px; }
      .position { min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap site-inner">
      <a class="logo" href="welcome.html" aria-label="InfoByte">Info<span>Byte</span></a>
      <a class="home" id="home" href="welcome.html">← Басты бет</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="hero-label">Информатика кітапханасы</p>
      <h1>Кітаптан термин іздеу</h1>

      <form id="search" class="search" role="search" autocomplete="off">
        <label class="sr-only" for="term">Термин</label>
        <input id="term" name="q" type="text" inputmode="search" enterkeyhint="search"
               maxlength="120" placeholder="Терминді енгізіңіз">
        <button class="go" type="submit">Іздеу</button>
      </form>

      <div class="examples">
        <span class="examples-label">Мысалы</span>
        <button class="chip" type="button" data-term="Алгоритм">Алгоритм</button>
        <button class="chip" type="button" data-term="Цикл">Цикл</button>
        <button class="chip" type="button" data-term="Массив">Массив</button>
      </div>
    </section>

    <section id="result" class="card" aria-live="polite" aria-busy="false">
      <p class="eyebrow">PDF кітапханасы</p>
      <h2 id="heading">Қай терминді іздейсіз?</h2>
      <p id="notice" class="notice" role="status" hidden></p>
      <p id="meta" class="meta" hidden>PDF беті: <strong id="page"></strong></p>
      <p id="excerpt">Терминді енгізіңіз немесе жоғарыдағы мысалдардың бірін таңдаңыз.</p>
      <div id="pager" class="pager" hidden>
        <button id="prev" class="nav" type="button">← Алдыңғы</button>
        <span id="position" class="position">1 / 1</span>
        <button id="next" class="nav" type="button">Келесі →</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      // ---- Жобаға байланысты баптаулар --------------------------------------
      // Негізгі жобаның нақты мәніне қарай осы жерді тексеріңіз.
      var CONFIG = {
        apiUrl: "/api/books/search",   // API адресі
        loginUrl: "login.html",        // 401 болғанда ашылатын кіру беті
        tokenStorageKey: "token",      // Токен localStorage-та сақталса, оның кілті. Cookie-сессия болса, өзгертпеңіз
        maxTermLength: 120
      };

      // library.py (pdf_search.py) қайтаратын notice мәтіндерінің басы.
      var EMPTY_PREFIX = "Кітапхана бос";
      var UNREADABLE_PREFIX = "Кітаптың мәтінін оқу мүмкін болмады";
      var NOT_FOUND_PREFIX = "Термин табылмады";

      var IDLE_TITLE = "Қай терминді іздейсіз?";
      var IDLE_TEXT = "Терминді енгізіңіз немесе жоғарыдағы мысалдардың бірін таңдаңыз.";

      // ---- Элементтер -------------------------------------------------------
      var form = document.getElementById("search");
      var input = document.getElementById("term");
      var card = document.getElementById("result");
      var heading = document.getElementById("heading");
      var notice = document.getElementById("notice");
      var meta = document.getElementById("meta");
      var pageNumber = document.getElementById("page");
      var excerpt = document.getElementById("excerpt");
      var pager = document.getElementById("pager");
      var position = document.getElementById("position");
      var prevButton = document.getElementById("prev");
      var nextButton = document.getElementById("next");

      // ---- Күй --------------------------------------------------------------
      var results = [];
      var index = 0;
      var requestId = 0;     // ең соңғы сұраудың нөмірі: ескі жауап жаңасын алмастырмайды
      var controller = null; // ескі сұрауды тоқтату үшін

      // ---- Көрсету ----------------------------------------------------------
      function setBusy(value) {
        card.setAttribute("aria-busy", value ? "true" : "false");
      }

      function showStatus(title, text, isProblem) {
        results = [];
        index = 0;
        card.classList.toggle("is-problem", Boolean(isProblem));
        heading.textContent = title;
        notice.textContent = "";
        notice.hidden = true;
        meta.hidden = true;
        pager.hidden = true;
        excerpt.replaceChildren(document.createTextNode(text));
      }

      function showNotice(text) {
        notice.textContent = text;
        notice.hidden = !text;
      }

      function renderResult() {
        var item = results[index];
        card.classList.remove("is-problem");
        heading.textContent = item.book;
        pageNumber.textContent = String(item.page);
        meta.hidden = false;

        var parts = [document.createTextNode(item.before)];
        if (item.match) {
          var mark = document.createElement("mark");
          mark.textContent = item.match;
          parts.push(mark);
        }
        parts.push(document.createTextNode(item.after));
        excerpt.replaceChildren.apply(excerpt, parts);

        position.textContent = (index + 1) + " / " + results.length;
        prevButton.disabled = index === 0;
        nextButton.disabled = index === results.length - 1;
        pager.hidden = false;
      }

      function go(step) {
        var target = index + step;
        if (target < 0 || target >= results.length) { return; }
        index = target;
        renderResult();
      }

      // ---- Жауапты өңдеу ----------------------------------------------------
      function cleanResults(list) {
        return list
          .filter(function (item) {
            return item && typeof item === "object" && Number.isFinite(Number(item.page));
          })
          .map(function (item) {
            return {
              book: String(item.book == null ? "" : item.book),
              page: Number(item.page),
              before: String(item.before == null ? "" : item.before),
              match: String(item.match == null ? "" : item.match),
              after: String(item.after == null ? "" : item.after)
            };
          });
      }

      function showEmpty(term, serverNotice) {
        var title = NOT_FOUND_PREFIX;
        if (serverNotice.indexOf(EMPTY_PREFIX) === 0) {
          title = EMPTY_PREFIX;
        } else if (serverNotice.indexOf(UNREADABLE_PREFIX) === 0) {
          title = UNREADABLE_PREFIX;
        }
        var detail = serverNotice;
        if (detail.indexOf(title) === 0) {
          detail = detail.slice(title.length).replace(/^[\s.:;,\-–—]+/, "");
        }
        if (!detail && title === NOT_FOUND_PREFIX) {
          detail = "«" + term + "» термині кітаптардан табылмады. " +
                   "Жазылуын тексеріңіз немесе басқа сөзбен іздеп көріңіз.";
        }
        showStatus(title, detail, title !== NOT_FOUND_PREFIX);
      }

      function authHeaders() {
        var headers = { Accept: "application/json" };
        try {
          var token = window.localStorage.getItem(CONFIG.tokenStorageKey);
          if (token) { headers.Authorization = "Bearer " + token; }
        } catch (error) { /* localStorage қолжетімсіз болуы мүмкін */ }
        return headers;
      }

      function redirectToLogin() {
        var next = window.location.pathname + window.location.search;
        window.location.replace(CONFIG.loginUrl + "?next=" + encodeURIComponent(next));
      }

      function rememberTerm(term) {
        try {
          var url = new URL(window.location.href);
          url.searchParams.set("q", term);
          window.history.replaceState(null, "", url.toString());
        } catch (error) { /* file:// сияқты ортада адрес жолын өзгерту мүмкін болмауы мүмкін */ }
      }

      // ---- Іздеу ------------------------------------------------------------
      async function search() {
        var term = input.value.replace(/\s+/g, " ").trim();
        var id = ++requestId;                     // кез келген жаңа әрекет ескі сұрауды жарамсыз етеді
        if (controller) { controller.abort(); }
        controller = null;

        if (!term) {
          setBusy(false);
          showStatus(IDLE_TITLE, "Іздеу үшін терминді енгізіңіз.", false);
          input.focus();
          return;
        }
        if (term.length > CONFIG.maxTermLength) {
          setBusy(false);
          showStatus("Термин тым ұзын", "Термин " + CONFIG.maxTermLength + " таңбадан аспауы керек.", true);
          return;
        }

        rememberTerm(term);
        setBusy(true);
        showStatus("Ізделуде…", "«" + term + "» термині кітаптардан ізделуде.", false);

        controller = typeof AbortController === "function" ? new AbortController() : null;
        var response;
        try {
          response = await fetch(CONFIG.apiUrl + "?q=" + encodeURIComponent(term), {
            headers: authHeaders(),
            credentials: "same-origin",
            signal: controller ? controller.signal : undefined
          });
        } catch (error) {
          if (id !== requestId || (error && error.name === "AbortError")) { return; }
          setBusy(false);
          showStatus("Серверге қосылу мүмкін болмады",
                     "Интернет байланысын және сервердің қосулы екенін тексеріп, қайта көріңіз.", true);
          return;
        }
        if (id !== requestId) { return; }

        if (response.status === 401) {
          redirectToLogin();
          return;
        }

        var data = null;
        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }
        if (id !== requestId) { return; }
        setBusy(false);

        if (!response.ok) {
          if (response.status >= 500) {
            showStatus("Сервер қатесі",
                       "Сервер сұранысты орындай алмады. Біраздан кейін қайталап көріңіз.", true);
          } else if (response.status === 404) {
            showStatus("Іздеу қызметі табылмады",
                       "Кітапхана қызметі серверде қосылмаған (404).", true);
          } else {
            var detail = data && typeof data.detail === "string"
              ? data.detail : "Сұранысты тексеріп, қайта көріңіз.";
            showStatus("Іздеу орындалмады", detail, true);
          }
          return;
        }

        if (!data || !Array.isArray(data.results)) {
          showStatus("Күтпеген жауап", "Сервер жауабын оқу мүмкін болмады.", true);
          return;
        }

        var serverNotice = typeof data.notice === "string" ? data.notice : "";
        results = cleanResults(data.results);
        index = 0;                                 // жаңа іздеу әрқашан бірінші нәтижеден басталады

        if (results.length === 0) {
          showEmpty(term, serverNotice);
          return;
        }
        renderResult();
        showNotice(serverNotice);                  // бір кітап оқылмаса да, үзінді көрсетіледі
      }

      // ---- Оқиғалар ---------------------------------------------------------
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        search();
      });

      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
        chip.addEventListener("click", function () {
          input.value = chip.getAttribute("data-term") || "";
          search();
        });
      });

      prevButton.addEventListener("click", function () { go(-1); });
      nextButton.addEventListener("click", function () { go(1); });

      document.addEventListener("keydown", function (event) {
        if (event.target === input || event.altKey || event.ctrlKey || event.metaKey) { return; }
        if (event.key === "ArrowLeft") { go(-1); }
        if (event.key === "ArrowRight") { go(1); }
      });

      // welcome.html: library.html?q=термин
      var initial = new URLSearchParams(window.location.search).get("q");
      if (initial && initial.trim()) {
        input.value = initial.trim();
        search();
      }
    })();
  </script>
</body>
</html>
